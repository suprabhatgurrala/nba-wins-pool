name: PR Checks
on:
  pull_request:

jobs:
  tests:
    name: Containerized Tests
    runs-on: self-hosted
    env:
      BUILD_DIR: tmp/pr_builds/PR_${{ github.event.number }}/${{ github.run_id }}
      DOCKER_PROJECT_NAME: pr-tests-${{ github.event.number }}-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            path: ${{ env.BUILD_DIR }}
            fetch-depth: 2

      - name: Create .env file for NBA API key
        env:
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
        working-directory: ${{ env.BUILD_DIR }}
        run: echo "NBA_API_KEY=$NBA_API_KEY" > backend/.env

      - name: Backend Unit Tests with Docker
        working-directory: ${{ env.BUILD_DIR }}
        run: make backend_tests

      - name: Check for frontend changes
        id: changes
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- frontend playwright_tests; then
            echo "skip_layout=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip_layout=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Playwright Layout Checks and E2E Tests with Docker
        working-directory: ${{ env.BUILD_DIR }}
        run: make e2e_tests SKIP_LAYOUT=${{ steps.changes.outputs.skip_layout }}

      - name: Cleanup Docker Project Resources
        if: always()
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          docker compose -p ${{ env.DOCKER_PROJECT_NAME }} -f compose.testing.yml down --volumes
          docker images --filter "label=com.docker.compose.project=${{ env.DOCKER_PROJECT_NAME }}" -q | xargs -r docker rmi -f

      - name: Cleanup Files
        if: always()
        run: rm -rfv ${{ env.BUILD_DIR }}
